<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0ea5a0">
<title>오프라인 — 아이마디</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    background: linear-gradient(145deg, #0b6f6a 0%, #0ea5a0 45%, #22c9c3 80%, #7dd3d0 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
  }
  .ico { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.3px; }
  p { font-size: 14px; line-height: 1.7; opacity: 0.92; margin-bottom: 20px; }
  .hint {
    font-size: 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 22px;
    text-align: left;
    line-height: 1.7;
  }
  button {
    background: #fff; color: #0ea5a0;
    border: none; border-radius: 14px;
    padding: 14px 28px;
    font-size: 15px; font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    min-height: 48px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
  .brand { font-size: 13px; opacity: 0.7; margin-top: 28px; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="ico">📡</div>
    <h1>네트워크 연결을 확인해주세요</h1>
    <p>일시적으로 인터넷에 연결되지 않습니다.<br>잠시 후 다시 시도해주세요.</p>
    <div class="hint">
      <strong>확인 사항</strong><br>
      • Wi-Fi 또는 모바일 데이터가 켜져있는지<br>
      • 비행기 모드가 꺼져있는지<br>
      • VPN/방화벽이 차단하지 않는지
    </div>
    <button onclick="window.location.reload()">다시 시도</button>
  </div>
  <div class="brand">아이마디 · MADI</div>
</div>
<script>
  // 네트워크 복구 시 자동 재시도
  window.addEventListener('online', function() {
    setTimeout(function() { window.location.reload(); }, 600);
  });
</script>
</body>
</html>
